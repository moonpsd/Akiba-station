    <main class="admin-main">
    <div class="container">
      <form id="formAdmin" novalidate>
          <h1>Novo usuário</h1>
          <p class="subtitulo">Cadastre um novo usuário na aplicação</p>

          <div class="campo">
              <input type="text" id="nome" name="nome" placeholder=" " autocomplete="off" required>
              <label for="nome">Nome do usuário</label>
          </div>

          <div class="campo">
              <input type="email" id="email" name="email" placeholder=" " autocomplete="off" required>
              <label for="email">E-mail</label>
          </div>

          <p id="mensagem" class="mensagem" aria-live="polite"></p>

          <div class="admin-form-actions">
            <button type="submit" class="btn_principal">Cadastrar</button>
            <button type="button" class="admin-btn-secondary" id="limparCampos">Limpar campos</button>
          </div>
      </form>
    </div>

    <section class="lista_usuarios" aria-labelledby="tituloUsuarios">
      <div class="lista_cabecalho">
        <h2 id="tituloUsuarios">Usuários cadastrados</h2>
        <span id="contador" class="contador" aria-live="polite"></span>
      </div>
      <div class="admin-tools">
        <label for="pesquisaUsuarios">Pesquisar por nome ou e-mail</label>
        <input id="pesquisaUsuarios" type="search" placeholder="Pesquisar usuários..." autocomplete="off">
        <button type="button" id="excluirTodos" class="admin-btn-danger">Excluir todos</button>
      </div>
      <ul id="listaUsuarios" class="admin-user-list" aria-live="polite"></ul>
      <p id="vazio" class="vazio">Nenhum usuário cadastrado ainda.</p>
    </section>
  </main>
