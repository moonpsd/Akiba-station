<body>

      <ul class="menu">

      <ul class="login">
        <li><a href="cadastro.html">Cadastro</a></li>
        <li><a href="entrar.html">Entrar</a></li>
        <li><a href="admin.html">Admin</a></li>
      </ul>
    </nav>

    <div class="container">
      <form id="formCadastro" action="cadastro.php" method="POST" novalidate>
          <h2>Cadastro</h2>

          <!-- Indicador de etapas -->
          <div class="progresso" aria-hidden="true">
              <span id="barra1" class="barra ativa"></span>
              <span id="barra2" class="barra"></span>
          </div>
          <p id="textoEtapa" class="texto_etapa">Etapa 1 de 2 &middot; Sobre você</p>

          <!-- ETAPA 1: nome, usuário e data de nascimento -->
          <section id="etapa1" class="etapa">
              <div class="campo">
                  <input type="text" id="nome" name="nome" placeholder=" " autocomplete="name" required>
                  <label for="nome">Nome completo</label>
              </div>

              <div class="campo">
                  <input type="text" id="usuario" name="usuario" placeholder=" " autocomplete="username"
                         minlength="3" maxlength="20" pattern="[A-Za-z0-9_.]+" required>
                  <label for="usuario">Nome de usuário</label>
              </div>

              <div class="campo campo_data">
                  <input type="date" id="nascimento" name="nascimento" placeholder=" " autocomplete="bday" required>
                  <label for="nascimento">Data de nascimento</label>
              </div>

              <p id="mensagem1" class="mensagem" aria-live="polite"></p>

              <button type="button" id="btnContinuar" class="btn_principal">Continuar</button>
          </section>

          <!-- ETAPA 2: e-mail e senhas -->
          <section id="etapa2" class="etapa oculto">
              <div class="campo">
                  <input type="email" id="email" name="email" placeholder=" " autocomplete="email" required>
                  <label for="email">E-mail</label>
              </div>

              <div class="campo">
                  <input type="password" id="senha" name="senha" placeholder=" " autocomplete="new-password"
                         minlength="8" required>
                  <label for="senha">Senha</label>
                  <button type="button" class="btn_senha" data-alvo="senha">Mostrar</button>
              </div>

              <div class="campo">
                  <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder=" "
                         autocomplete="new-password" minlength="8" required>
                  <label for="confirmarSenha">Confirmar senha</label>
                  <button type="button" class="btn_senha" data-alvo="confirmarSenha">Mostrar</button>
              </div>

              <p id="mensagem2" class="mensagem" aria-live="polite"></p>

              <button type="submit" id="btnCadastrar" class="btn_principal">Cadastrar</button>
              <button type="button" id="btnVoltar" class="btn_voltar">Voltar</button>
          </section>

          <p class="link_alternativo">Já tem conta? <a href="entrar.html">Entrar</a></p>
      </form>
    </div>

</body>

</html>
